<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111110">
  <meta name="description" content="TaToo Barber Shop — كل روابطنا الرسمية وموقع المحل في مكان واحد.">
  <title>TaToo | Barber Shop</title>
  <style>
    :root{--bg:#111110;--surface:#1d1d1a;--surface-hover:#292824;--border:#3b382f;--accent:#d7b77a;--text:#f7f5ef;--muted:#b2afa7}
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse 75% 42% at 50% 4%,#29251c 0%,transparent 90%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.5}
    main{width:min(100%,490px);padding:64px 25px 40px;text-align:center}
    .emblem{display:grid;place-items:center;margin:0 auto 19px;width:92px;height:92px;border:1px solid #806d48;border-radius:50%;background:linear-gradient(145deg,#2c291f,#151513);box-shadow:0 0 0 7px #d7b77a0c}
    .emblem svg{width:42px;height:42px;stroke:var(--accent);stroke-width:1.65;fill:none;stroke-linecap:round;stroke-linejoin:round}
    h1{direction:ltr;letter-spacing:.055em;font-family:Georgia,'Times New Roman',serif;font-size:clamp(46px,12vw,62px);font-weight:700;line-height:1.04;margin:0;color:var(--text)}
    .subheading{font-size:11px;letter-spacing:.4em;direction:ltr;color:var(--accent);margin:11px 0 24px;font-weight:600}
    .rule{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:24px}
    .rule::before,.rule::after{content:"";height:1px;width:42px;background:#62563e}
    .rule i{width:5px;height:5px;background:var(--accent);transform:rotate(45deg)}
    h2{font-size:20px;font-weight:700;margin:0 0 6px}
    .intro{font-size:13px;color:var(--muted);margin:0 0 31px}
    nav{display:grid;gap:13px}
    .link{direction:ltr;display:flex;align-items:center;min-height:72px;padding:14px 17px;gap:17px;background:var(--surface);border:1px solid var(--border);border-radius:15px;text-decoration:none;color:var(--text);box-shadow:0 5px 16px #00000021;transition:transform .18s,border-color .18s,background .18s}
    .link:hover,.link:focus-visible{transform:translateY(-2px);background:var(--surface-hover);border-color:var(--accent);outline:none}
    .link-pending{opacity:.64;cursor:default}
    .link-pending:hover{transform:none;background:var(--surface);border-color:var(--border)}
    .link-pending .arrow{font-size:10px;letter-spacing:0;color:var(--muted);white-space:nowrap}
    .icon-box{width:43px;height:43px;flex:none;display:grid;place-items:center;background:#d7b77a14;border-radius:12px;color:var(--accent)}
    .icon-box svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .link-content{display:flex;flex-direction:column;align-items:flex-start;flex:1;gap:3px;text-align:left}
    .link-content strong{font-family:Arial,sans-serif;font-size:16px;letter-spacing:.015em}
    .link-content small{font-family:Tahoma,Arial,sans-serif;font-size:11px;color:var(--muted);direction:rtl}
    .arrow{font-size:20px;color:var(--accent);font-family:Arial,sans-serif;line-height:1}
    footer{margin-top:43px;font:11px Arial,sans-serif;color:#9d988c;letter-spacing:.07em;direction:ltr}
    footer span{color:var(--accent)}
    @media (max-width:390px){main{padding:44px 17px 29px}.link{min-height:67px}h2{font-size:18px}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <div class="emblem" aria-hidden="true">
      <svg viewBox="0 0 48 48"><circle cx="11" cy="37" r="5"/><circle cx="29" cy="37" r="5"/><path d="M14.5 33.4 36 10M25.6 33.5 11 10M33 8l4 4M10 10l-1-4M21 22l4 4"/></svg>
    </div>
    <h1>TaToo</h1>
    <p class="subheading">BARBER SHOP</p>
    <div class="rule" aria-hidden="true"><i></i></div>
    <h2>أهلاً بيك في TaToo</h2>
    <p class="intro">كل حساباتنا ومكان المحل في رابط واحد</p>
    <nav aria-label="روابط TaToo الرسمية">
      <a class="link" href="https://www.facebook.com/share/1DS5VfSvUR/" target="_blank" rel="noopener noreferrer" aria-label="افتح صفحة TaToo على Facebook">
        <span class="icon-box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M17 3h-3a5 5 0 0 0-5 5v3H6v4h3v6h4v-6h3l1-4h-4V8a1 1 0 0 1 1-1h3z"/></svg></span>
        <span class="link-content"><strong>Facebook</strong><small>تابع صفحتنا على فيسبوك</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.instagram.com/tamer_tatooo_official?stkn=NTZ1OXVraDF4cTUy" target="_blank" rel="noopener noreferrer" aria-label="افتح حساب TaToo على Instagram">
        <span class="icon-box" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor" stroke="none"/></svg></span>
        <span class="link-content"><strong>Instagram</strong><small>تابع أحدث أخبارنا</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.tiktok.com/@tamertatoooo?_r=1&amp;_t=ZT-9ACjafCSEpx" target="_blank" rel="noopener noreferrer" aria-label="افتح حساب TaToo على TikTok">
        <span class="icon-box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 3v11.5a4 4 0 1 1-4-4M14 3c1 3.6 3.2 5.5 7 5.7v4a11 11 0 0 1-7-2.4"/></svg></span>
        <span class="link-content"><strong>TikTok</strong><small>شوف جديدنا على تيك توك</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <div class="link link-pending" aria-label="واتساب — بانتظار رقم المحل">
        <span class="icon-box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a8.5 8.5 0 0 1-12.4 7.6L3 20l1-4.5A8.5 8.5 0 1 1 20 11.5z"/><path d="M8.4 8.4c.2-.3.5-.3.7 0l1 1.5c.2.3.2.5 0 .8l-.5.6a9 9 0 0 0 3.1 3l.6-.5c.2-.2.5-.2.8 0l1.5 1c.3.2.3.5 0 .7-.5.5-1.1.7-1.7.6-2.5-.4-5.6-3.5-6-6-.1-.6.1-1.2.5-1.7z"/></svg></span>
        <span class="link-content"><strong>WhatsApp</strong><small>تواصل معانا مباشرة</small></span>
        <span class="arrow" aria-hidden="true">قريبًا</span>
      </div>
      <div class="link link-pending" aria-label="عنوان المحل — بانتظار رابط Google Maps">
        <span class="icon-box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <span class="link-content"><strong>Google Maps</strong><small>موقع المحل على الخريطة</small></span>
        <span class="arrow" aria-hidden="true">قريبًا</span>
      </div>
    </nav>
    <footer>© 2026 <span>TaToo</span> BARBER SHOP</footer>
  </main>
</body>
</html>
